<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - iCOAtlas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 18px 0 rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        
        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #0B4EA2 0%, #EE1C25 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .icon {
            font-size: 5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #0B4EA2;
        }
        
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #475569;
        }
        
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            background: #EE1C25;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        button:hover {
            background: #c4161e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(238, 28, 37, 0.2);
        }
        
        button.secondary {
            background: transparent;
            border: 2px solid #0B4EA2;
            color: #0B4EA2;
        }
        
        button.secondary:hover {
            background: #0B4EA2;
            color: white;
        }
        
        .status {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(11, 78, 162, 0.05);
            border: 1px solid rgba(11, 78, 162, 0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #475569;
        }
        
        .status.online {
            background: rgba(0, 255, 0, 0.05);
            border-color: rgba(0, 255, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">iCOAtlas</div>
        <div class="icon">📡</div>
        <h1>Ste offline</h1>
        <p>
            Vaše internetové pripojenie je momentálne nedostupné. 
            Niektoré funkcie môžu byť obmedzené.
        </p>
        <div class="actions">
            <button onclick="window.location.reload()">Obnoviť stránku</button>
            <button class="secondary" onclick="window.location.href='/'">Späť na hlavnú</button>
        </div>
        <div class="status" id="status">
            <div>Kontrolujem pripojenie...</div>
        </div>
    </div>
    
    <script>
        // Check online status
        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (navigator.onLine) {
                statusEl.innerHTML = '<div style="color: #16a34a; font-weight: 600;">✅ Pripojenie obnovené! Obnovte stránku.</div>';
                statusEl.classList.add('online');
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } else {
                statusEl.innerHTML = '<div>❌ Stále offline</div>';
                statusEl.classList.remove('online');
            }
        }
        
        // Listen for online/offline events
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        
        // Initial check
        updateStatus();
        
        // Periodic check
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
