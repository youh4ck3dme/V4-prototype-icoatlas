[project]
name = "icoatlas-backend"
version = "4.0.0"
description = "ICO Atlas V4 Backend - Cross-border registry search and graph intelligence"
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "gunicorn>=22.0.0",
    "httpx>=0.27.0",
    "lxml>=5.1.0",
    "playwright>=1.40.0",
    "prometheus-client>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "sqlalchemy>=2.0.23",
    "stripe>=16.1.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
