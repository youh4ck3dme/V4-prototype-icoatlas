# --- HTTP: only ACME + redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;

    server_name nexify-studio.cloud www.nexify-studio.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    # Healthcheck over plain HTTP (avoid redirect -> HTTPS -> cert verify problem)
    location = /api/health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://backend:8000/health;
    }


    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: main reverse proxy ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
server_name nexify-studio.cloud www.nexify-studio.cloud localhost;

    ssl_certificate     /etc/letsencrypt/live/nexify-studio.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexify-studio.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;proxy_pass http://backend:8000;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://frontend:80;
    }
}
